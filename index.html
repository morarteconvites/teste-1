<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Camera Switch</title>
  <style>
    video {
      width: 100%;
      max-width: 400px;
      background: #000;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <video id="video" autoplay playsinline></video>
  <button id="switchBtn">Trocar Câmera</button>

  <script>
    let useFrontCamera = true; // começa com a frontal

    async function startCamera() {
      // Encerrar stream anterior
      if (window.currentStream) {
        window.currentStream.getTracks().forEach(t => t.stop());
      }

      const constraints = {
        audio: false, // remove áudio
        video: {
          facingMode: useFrontCamera ? "user" : "environment",
          width: { ideal: 1280 },
          height: { ideal: 720 },
          zoom: false // evita controle automático de zoom
        }
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        window.currentStream = stream;
        document.getElementById("video").srcObject = stream;
      } catch (error) {
        console.error("Erro ao acessar câmera:", error);
        alert("Erro ao acessar a câmera.");
      }
    }

    // Botão para alternar câmera
    document.getElementById("switchBtn").addEventListener("click", () => {
      useFrontCamera = !useFrontCamera;
      startCamera();
    });

    // Inicia automaticamente
    startCamera();
  </script>

</body>
</html>
